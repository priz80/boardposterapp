<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>MyAvito</title>
    <script>
        var pathParts = location.pathname.split("/").filter(Boolean);
        if (pathParts.length > 0) {
            window.location.replace(location.origin + "/" + pathParts[0] + "/");
        }
    </script>
</head>

<body>
    <div id="root"></div>
</body>

</html>
