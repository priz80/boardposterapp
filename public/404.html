<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>MyAvito</title>
    <script>
        var pathParts = location.pathname.split("/");
        var repoName = pathParts[1];
        if (repoName) {
            window.location.replace(location.origin + "/" + repoName + "/");
        } else {
            window.location.replace("/");
        }
    </script>
</head>

<body>
    <div id="root"></div>
</body>

</html>
