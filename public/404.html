<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>MyAvito</title>
    <script>
        var segmentCount = location.pathname.split("/").length - 1;
        var relativePath = "/" + location.pathname.slice(segmentCount * -1);
        window.history.replaceState({}, "", relativePath);
    </script>
</head>

<body>
    <div id="root"></div>
    <script src="/boardposterapp/static/js/main.js"></script>
    <link href="/boardposterapp/static/css/main.css" rel="stylesheet">
</body>

</html>
